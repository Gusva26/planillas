name: cafae-local
services:
  db:
    image: postgres:17
    container_name: cafae-postgres-dev
    environment:
      POSTGRES_DB: cafae_dev
      POSTGRES_USER: cafae_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar scripts/db.ps1 init}
      TZ: America/Lima
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - cafae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafae_migrator -d cafae_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: cafae-app:local
    container_name: cafae-app-dev
    environment:
      CAFAE_DB_HOST: db
      CAFAE_DB_NAME: cafae_dev
      CAFAE_DB_PASSWORD: ${CAFAE_DB_PASSWORD:-}
      TZ: America/Lima
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  cafae_pgdata:


